<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងវត្តមានសិស្ស - PTEC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ThyrithSor/momentkh@3.0.3/momentkh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&family=Moul&display=swap');

        :root {
            --primary-font: 'Hanuman', serif;
            --title-font: 'Moul', cursive;
        }

        body {
            font-family: var(--primary-font);
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1300px;
            margin: auto;
        }

        #printArea {
            width: 100%;
            max-width: 297mm;
            margin: auto;
        }

        .page-container {
            width: 297mm;
            height: 209mm; /* កម្ពស់សម្រាប់ A4 Landscape */
            padding: 10mm 12mm;
            margin: 0 auto;
            box-sizing: border-box;
            background: white;
            display: flex;
            flex-direction: column;
            color: black;
            position: relative;
            overflow: hidden;
            page-break-inside: avoid;
        }

        .page-container:not(:last-child) {
            margin-bottom: 30px;
        }

        .kh-moul { font-family: var(--title-font); font-weight: normal; }

        .admin-header { text-align: center; margin-bottom: 5px; }
        .report-header-img { height: 25px; width: auto; margin: 5px auto 0 auto; display: block; }
        
        .org-info { line-height: 1.3; text-align: left; font-size: 11pt; font-weight: bold; margin-bottom: 5px; }
        .org-info p { margin: 0; }
        .title-section { width: 100%; text-align: center; margin-bottom: 5px; }
        .info-row { display: flex; justify-content: space-between; width: 100%; font-size: 11pt; font-weight: bold; margin-bottom: 5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 1.2pt solid black;
        }

        thead th {
            height: 1px;
        }

        th, td {
            border: 0.8pt solid black;
            text-align: center;
            vertical-align: middle;
            padding: 0;
            font-size: 10pt;
            height: 24px;
        }

        th { background-color: #fcfcfc; font-weight: bold; }

        .vertical-wrapper {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .vertical-text {
            display: block;
            white-space: nowrap;
            transform: translate(-50%, -50%) rotate(-90deg); 
            width: 48px;
            text-align: center;
            font-size: 9pt;
            font-weight: bold;
            position: absolute;
            left: 50%;
            top: 50%;
            line-height: 1;
        }

        .id-col { width: 32px; }
        .name-col { width: 180px; text-align: left; padding-left: 8px; font-weight: bold; overflow: hidden; white-space: nowrap; }
        
        .sun-bg { background-color: #fff1f1 !important; }
        .sun-text { color: #d93025 !important; font-weight: bold; }

        .signature-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            margin-top: 15px;
            padding-top: 5px;
        }

        .sig-box { text-align: center; }
        .lunar-date { font-size: 10pt; margin-bottom: 2px; white-space: nowrap; }
        .solar-date { font-size: 10.5pt; font-weight: normal; margin-bottom: 5px; }
        .role-title { font-family: var(--title-font); font-size: 11pt; }

        .role { font-weight: bold; margin-top: 5px; margin-bottom: 40px; display: block; font-size: 11pt; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            flex-wrap: wrap;
        }

        select, input { padding: 8px; font-family: var(--primary-font); border: 1px solid #ccc; border-radius: 4px; outline: none;}
        select:focus, input:focus { border-color: #1a73e8; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-family: var(--primary-font); transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        button:hover { opacity: 0.9; }
        
        @media print {
            @page { size: A4 landscape; margin: 0; }
            .controls { display: none; }
            body { padding: 0; margin: 0; background: white; }
            .container { box-shadow: none !important; padding: 0; margin: 0; max-width: 100%; border: none; }
            .page-container { 
                margin: 0 !important; 
                border: none !important; 
                box-shadow: none !important; 
                page-break-after: always; 
                page-break-inside: avoid;
            }
            .page-container:last-child {
                page-break-after: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button onclick="window.location.href='attendance-1.html'" style="background: #475569; color: white;">ត្រឡប់ក្រោយ</button>
        
        <label>ខែ៖</label>
        <select id="monthSelect"></select>
        <label>ឆ្នាំ៖</label>
        <input type="number" id="yearInput" value="2026" style="width: 80px;">
        <label>ចំនួនសិស្ស៖</label>
        <input type="number" id="studentCount" value="0" min="1" max="100" style="width: 70px;">
        
        <button onclick="exportExcel()" style="background: #16a34a; color: white;">ទាញយក Excel</button>
        <button id="btnDownload" onclick="downloadPDF()" style="background: #d93025; color: white;">ទាញយក PDF</button>
        <button onclick="window.print()" style="background: #1a73e8; color: white;">បោះពុម្ព</button>
    </div>

    <div id="printArea"></div>
</div>

<script>
    const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
    const days = ["អាទិត្យ", "ច័ន្ទ", "អង្គារ", "ពុធ", "ព្រហស្បតិ៍", "សុក្រ", "សៅរ៍"];
    const khDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    
    function toKhmerNum(num) { 
        if(num === null || num === undefined) return '';
        return num.toString().split('').map(d => khDigits[d] || d).join(''); 
    }
    
    const monthSelect = document.getElementById('monthSelect');
    const yearInput = document.getElementById('yearInput');
    const studentCountInput = document.getElementById('studentCount');
    const printArea = document.getElementById('printArea');

    months.forEach((m, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = m;
        monthSelect.appendChild(opt);
    });

    let customData = null;
    let appSettings = {}; 

    function createPage(startIdx, endIdx, isFirst, isLast, data) {
        const mIdx = parseInt(monthSelect.value);
        const year = parseInt(yearInput.value);
        const daysCount = new Date(year, mIdx + 1, 0).getDate();
        
        const className = data && data.className ? data.className : (appSettings.className || "..................");
        const school = data && data.school ? data.school : (appSettings.schoolName || "..................");
        const org1 = data && data.org1 ? data.org1 : (appSettings.unit1 || "មន្ទីរអប់រំ យុវជន និងកីឡា..................");
        const org2 = data && data.org2 ? data.org2 : (appSettings.unit2 || "ការិយាល័យអប់រំ យុវជន និងកីឡា..................");
        const students = data ? data.students : [];
        const attendance = data ? data.attendance : {};
        
        const academicYear = appSettings.academicYear || "២០២៤-២០២៥";
        const managerRole = appSettings.managerRole || "នាយកសាលា";

        let html = `<div class="page-container">`;
        
        if (isFirst) {
            html += `
                <div class="admin-header">
                    <h3 class="kh-moul" style="font-size: 13pt; margin:0;">ព្រះរាជាណាចក្រកម្ពុជា</h3>
                    <h3 class="kh-moul" style="font-size: 13pt; margin:0;">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                    <img src="https://lh3.googleusercontent.com/d/1BnGzoisjHxGRiMbsrP-rZ1F9zvSfdtAh" class="report-header-img" crossorigin="anonymous">
                </div>
                <div class="org-info">
                    <p style="font-size: 11pt;">${org1}</p>
                    <p style="font-size: 11pt;">${org2}</p>
                    <p style="font-size: 11pt;">${school}</p>
                </div>
                <div class="title-section">
                    <h2 class="kh-moul" style="font-size: 12pt; margin: 0; display: inline-block; border-bottom: 1.5px solid black; padding-bottom: 2px;">របាយការណ៍វត្តមានសិស្សប្រចាំខែ ${months[mIdx]}</h2>
                    <div class="info-row" style="margin-top: 5px;">
                        <span style="font-size: 10.5pt;">${className}</span>
                        <span style="font-size: 10.5pt;">ឆ្នាំសិក្សា ${academicYear}</span>
                    </div>
                </div>`;
        }

        html += `<table><thead>
            <tr>
                <th rowspan="3" class="id-col">ល.រ</th>
                <th rowspan="3" class="name-col">គោត្តនាម និងនាម</th>
                <th colspan="${daysCount}">កាលបរិច្ឆេទ</th>
                <th colspan="3" rowspan="2">អវត្តមាន</th>
                <th rowspan="3" style="width: 50px;">ផ្សេងៗ</th>
            </tr>
            <tr>`;
        
        for (let i = 1; i <= daysCount; i++) {
            const date = new Date(year, mIdx, i);
            const isSun = date.getDay() === 0;
            html += `<th class="${isSun ? 'sun-bg sun-text' : ''}" style="height:14px; font-size: 9pt;">${toKhmerNum(i)}</th>`;
        }
        html += `</tr><tr>`;
        
        for (let i = 1; i <= daysCount; i++) {
            const date = new Date(year, mIdx, i);
            const isSun = date.getDay() === 0;
            html += `<th class="${isSun ? 'sun-bg sun-text' : ''}">
                <div class="vertical-wrapper">
                    <span class="vertical-text">${days[date.getDay()]}</span>
                </div>
            </th>`;
        }
        html += `
            <th><div class="vertical-wrapper"><span class="vertical-text">ច្បាប់</span></div></th>
            <th><div class="vertical-wrapper"><span class="vertical-text">អត់ច្បាប់</span></div></th>
            <th><div class="vertical-wrapper"><span class="vertical-text">សរុប</span></div></th>
        </tr></thead><tbody>`;

        for (let i = startIdx; i <= endIdx; i++) {
            const student = (students && students[i-1]) ? students[i-1] : null;
            const studentName = student ? student.name : "";
            
            html += `<tr><td>${toKhmerNum(i)}</td><td class="name-col">${studentName}</td>`;
            
            let lCount = 0;
            let aCount = 0;

            for (let d = 1; d <= daysCount; d++) {
                const dateStr = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let statusChar = "";
                
                if (student && attendance && attendance[dateStr] && attendance[dateStr][student.uid]) {
                    const status = attendance[dateStr][student.uid].status;
                    if (status === 'P') { 
                        statusChar = "✓"; 
                    } else if (status === 'L') { 
                        statusChar = "ច"; 
                        lCount++; 
                    } else if (status === 'A') { 
                        statusChar = "អ"; 
                        aCount++; 
                    }
                }

                const date = new Date(year, mIdx, d);
                html += `<td class="${date.getDay() === 0 ? 'sun-bg' : ''}" style="font-weight: bold; color: #1e3a8a;">${statusChar}</td>`;
            }
            
            html += `<td style="color:#d97706; font-weight:bold;">${lCount > 0 ? toKhmerNum(lCount) : ''}</td>
                     <td style="color:#dc2626; font-weight:bold;">${aCount > 0 ? toKhmerNum(aCount) : ''}</td>
                     <td style="font-weight:bold;">${(lCount + aCount) > 0 ? toKhmerNum(lCount + aCount) : ''}</td>
                     <td></td></tr>`;
        }
        html += `</tbody></table>`;

        if (isLast) {
            const teacherName = data && data.teacher ? data.teacher : (appSettings.teacherName || "..................");
            
            let lunarStr = "ថ្ងៃ................ខែ..........ឆ្នាំ..........";
            const today = new Date();
            if (typeof momentkh !== 'undefined') {
                try {
                    const khmerDateObj = momentkh.fromDate(today);
                    lunarStr = momentkh.format(khmerDateObj).replace('ពុទ្ធសករាជ', 'ព.ស.');
                } catch (e) { console.error("Error formatting khmer date", e); }
            }
            const locationStr = appSettings.location ? `${appSettings.location}, ` : "";
            const solarStr = `${locationStr}ថ្ងៃទី${toKhmerNum(today.getDate())} ខែ${months[today.getMonth()]} ឆ្នាំ${toKhmerNum(today.getFullYear())}`;

            html += `
                <div class="signature-section">
                    <div class="sig-box">
                        <p style="font-size: 10.5pt; margin-bottom: 2px;">បានឃើញ និងឯកភាព</p>
                        <p class="role kh-moul">${managerRole}</p>
                    </div>
                    <div class="sig-box">
                        <p style="font-size: 10.5pt; margin-bottom: 2px;">${lunarStr}</p>
                        <p style="font-size: 10.5pt; margin-bottom: 5px;">${solarStr}</p>
                        <p class="role kh-moul">គ្រូបន្ទុកថ្នាក់</p>
                        <p class="kh-moul" style="margin-top:20px; margin-left: 2cm;">${teacherName}</p>
                    </div>
                </div>`;
        }

        html += `</div>`;
        
        return html;
    }

    function render() {
        printArea.innerHTML = "";
        const total = parseInt(studentCountInput.value) || 0;
        
        const maxRowsFirstPage = 13;      
        const maxRowsFirstPageSig = 8;   
        const maxRowsOtherPage = 20;      
        const maxRowsOtherPageSig = 15;   
        
        let current = 1;
        let pageNum = 1;

        if (total === 0) {
            printArea.innerHTML = createPage(0, 0, true, true, customData);
            return;
        }

        while (current <= total) {
            let isFirst = (pageNum === 1);
            let remaining = total - current + 1;
            
            let limitNoSig = isFirst ? maxRowsFirstPage : maxRowsOtherPage;
            let limitWithSig = isFirst ? maxRowsFirstPageSig : maxRowsOtherPageSig;
            
            let end;
            let isLast = false;

            if (remaining <= limitWithSig) {
                end = current + remaining - 1;
                isLast = true;
            } else {
                end = current + limitNoSig - 1;
                if (end >= total) {
                    end = total;
                    isLast = true;
                }
            }
            
            printArea.innerHTML += createPage(current, end, isFirst, isLast, customData);
            
            if (isLast) break;
            current = end + 1;
            pageNum++;
        }
    }

    function init() {
        const savedSettings = localStorage.getItem('app_settings');
        if (savedSettings) {
            try { appSettings = JSON.parse(savedSettings); } catch(e){}
        }

        const rawData = localStorage.getItem('temp_report_data');
        if (rawData) {
            customData = JSON.parse(rawData);
            monthSelect.value = customData.month;
            yearInput.value = customData.year;
            if(customData.students && customData.students.length > 0) {
                studentCountInput.value = customData.students.length;
            }
        } else {
            const today = new Date();
            monthSelect.value = today.getMonth();
            yearInput.value = today.getFullYear();
        }
        render();
    }

    // --- មុខងារទាញយក Excel ---
    window.exportExcel = function() {
        const total = parseInt(studentCountInput.value) || 0;
        if (total === 0) {
            alert("មិនមានទិន្នន័យដើម្បីទាញយកទេ!");
            return;
        }

        const mIdx = parseInt(monthSelect.value);
        const year = parseInt(yearInput.value);
        const daysCount = new Date(year, mIdx + 1, 0).getDate();
        
        const className = customData && customData.className ? customData.className : (appSettings.className || "..................");
        const school = customData && customData.school ? customData.school : (appSettings.schoolName || "..................");
        const org1 = customData && customData.org1 ? customData.org1 : (appSettings.unit1 || "មន្ទីរអប់រំ យុវជន និងកីឡា..................");
        const org2 = customData && customData.org2 ? customData.org2 : (appSettings.unit2 || "ការិយាល័យអប់រំ យុវជន និងកីឡា..................");
        const academicYear = appSettings.academicYear || "២០២៤-២០២៥";
        const students = customData ? customData.students : [];
        const attendance = customData ? customData.attendance : {};

        const totalCols = daysCount + 6; // ល.រ(1), ឈ្មោះ(1), ថ្ងៃទី(daysCount), ច្បាប់(1), អត់ច្បាប់(1), សរុប(1), ផ្សេងៗ(1)
        const ws_data = [];
        const merges = [];

        // Colors & Styles
        const BORDER = { 
            top: {style: 'thin', color: {rgb: "FF000000"}}, 
            bottom: {style: 'thin', color: {rgb: "FF000000"}}, 
            left: {style: 'thin', color: {rgb: "FF000000"}}, 
            right: {style: 'thin', color: {rgb: "FF000000"}} 
        };
        const FONT_NORMAL = { name: 'Khmer OS Battambang', sz: 10 };
        const FONT_BOLD = { name: 'Khmer OS Battambang', sz: 10, bold: true };
        const FONT_MOUL = { name: 'Khmer OS Moul Light', sz: 11 };
        
        const ALIGN_CENTER = { vertical: 'center', horizontal: 'center' };
        const ALIGN_LEFT = { vertical: 'center', horizontal: 'left' };
        const ALIGN_RIGHT = { vertical: 'center', horizontal: 'right' };
        
        const emptyCell = (style) => ({ v: '', t: 's', s: style || {} });

        // Header Structure
        let r0 = Array(totalCols).fill(null).map(() => emptyCell());
        r0[0] = { v: 'ព្រះរាជាណាចក្រកម្ពុជា', t: 's', s: { font: FONT_MOUL, alignment: ALIGN_CENTER } };
        ws_data.push(r0); merges.push({s:{r:0, c:0}, e:{r:0, c:totalCols-1}});

        let r1 = Array(totalCols).fill(null).map(() => emptyCell());
        r1[0] = { v: 'ជាតិ សាសនា ព្រះមហាក្សត្រ', t: 's', s: { font: FONT_MOUL, alignment: ALIGN_CENTER } };
        ws_data.push(r1); merges.push({s:{r:1, c:0}, e:{r:1, c:totalCols-1}});

        let r2 = Array(totalCols).fill(null).map(() => emptyCell());
        r2[0] = { v: org1, t: 's', s: { font: FONT_BOLD, alignment: ALIGN_LEFT } };
        ws_data.push(r2); merges.push({s:{r:2, c:0}, e:{r:2, c:8}});

        let r3 = Array(totalCols).fill(null).map(() => emptyCell());
        r3[0] = { v: org2, t: 's', s: { font: FONT_BOLD, alignment: ALIGN_LEFT } };
        ws_data.push(r3); merges.push({s:{r:3, c:0}, e:{r:3, c:8}});

        let r4 = Array(totalCols).fill(null).map(() => emptyCell());
        r4[0] = { v: school, t: 's', s: { font: FONT_BOLD, alignment: ALIGN_LEFT } };
        ws_data.push(r4); merges.push({s:{r:4, c:0}, e:{r:4, c:8}});

        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));

        let r6 = Array(totalCols).fill(null).map(() => emptyCell());
        r6[0] = { v: `របាយការណ៍វត្តមានសិស្សប្រចាំខែ ${months[mIdx]}`, t: 's', s: { font: { ...FONT_MOUL, sz: 12 }, alignment: ALIGN_CENTER } };
        ws_data.push(r6); merges.push({s:{r:6, c:0}, e:{r:6, c:totalCols-1}});

        let r7 = Array(totalCols).fill(null).map(() => emptyCell());
        r7[0] = { v: className, t: 's', s: { font: FONT_BOLD, alignment: ALIGN_LEFT } };
        r7[totalCols - 3] = { v: `ឆ្នាំសិក្សា ${academicYear}`, t: 's', s: { font: FONT_BOLD, alignment: ALIGN_RIGHT } };
        ws_data.push(r7); 
        merges.push({s:{r:7, c:0}, e:{r:7, c:5}});
        merges.push({s:{r:7, c:totalCols-3}, e:{r:7, c:totalCols-1}});

        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));

        // Table Headers Setup
        let startRow = 9;
        const TH_STYLE = { font: FONT_BOLD, alignment: ALIGN_CENTER, border: BORDER, fill: { fgColor: { rgb: "FFFCFCFC" } } };
        const TH_VERT = { ...TH_STYLE, alignment: { textRotation: 90, vertical: 'center', horizontal: 'center' } };

        let th1 = Array(totalCols).fill(null).map(() => emptyCell(TH_STYLE));
        let th2 = Array(totalCols).fill(null).map(() => emptyCell(TH_STYLE));
        let th3 = Array(totalCols).fill(null).map(() => emptyCell(TH_STYLE));

        th1[0] = { v: 'ល.រ', t: 's', s: TH_STYLE }; merges.push({s:{r:startRow, c:0}, e:{r:startRow+2, c:0}});
        th1[1] = { v: 'គោត្តនាម និងនាម', t: 's', s: TH_STYLE }; merges.push({s:{r:startRow, c:1}, e:{r:startRow+2, c:1}});
        th1[2] = { v: 'កាលបរិច្ឆេទ', t: 's', s: TH_STYLE }; merges.push({s:{r:startRow, c:2}, e:{r:startRow, c:1+daysCount}});
        
        let absCol = 2 + daysCount;
        th1[absCol] = { v: 'អវត្តមាន', t: 's', s: TH_STYLE }; merges.push({s:{r:startRow, c:absCol}, e:{r:startRow+1, c:absCol+2}});
        th1[absCol+3] = { v: 'ផ្សេងៗ', t: 's', s: TH_STYLE }; merges.push({s:{r:startRow, c:absCol+3}, e:{r:startRow+2, c:absCol+3}});

        for(let i=1; i<=daysCount; i++) {
            let d = new Date(year, mIdx, i);
            let isSun = d.getDay() === 0;
            let st1 = isSun ? { ...TH_STYLE, font: { ...FONT_BOLD, color: { rgb: "FFDC2626" } }, fill: { fgColor: { rgb: "FFFFF1F1" } } } : TH_STYLE;
            let st2 = isSun ? { ...TH_VERT, font: { ...FONT_BOLD, color: { rgb: "FFDC2626" } }, fill: { fgColor: { rgb: "FFFFF1F1" } } } : TH_VERT;
            
            th2[1+i] = { v: i, t: 'n', s: st1 }; // ទុកជាលេខធម្មតាដើម្បីងាយស្រួលក្នុង Excel
            th3[1+i] = { v: days[d.getDay()], t: 's', s: st2 };
        }

        th3[absCol] = { v: 'ច្បាប់', t: 's', s: TH_VERT };
        th3[absCol+1] = { v: 'អត់ច្បាប់', t: 's', s: TH_VERT };
        th3[absCol+2] = { v: 'សរុប', t: 's', s: TH_VERT };

        ws_data.push(th1, th2, th3);

        // Body Data Setup
        const TD_STYLE = { font: FONT_NORMAL, alignment: ALIGN_CENTER, border: BORDER };
        const TD_NAME = { font: FONT_BOLD, alignment: ALIGN_LEFT, border: BORDER };
        
        for (let i = 0; i < total; i++) {
            let student = students[i];
            let row = Array(totalCols).fill(null).map(() => emptyCell(TD_STYLE));
            row[0] = { v: i + 1, t: 'n', s: TD_STYLE };
            row[1] = { v: student ? student.name : '', t: 's', s: TD_NAME };

            let lCount = 0;
            let aCount = 0;

            for (let d = 1; d <= daysCount; d++) {
                const dateStr = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let statusChar = "";
                
                if (student && attendance && attendance[dateStr] && attendance[dateStr][student.uid]) {
                    const status = attendance[dateStr][student.uid].status;
                    if (status === 'P') statusChar = "✓"; 
                    else if (status === 'L') { statusChar = "ច"; lCount++; } 
                    else if (status === 'A') { statusChar = "អ"; aCount++; }
                }

                let dateObj = new Date(year, mIdx, d);
                let isSun = dateObj.getDay() === 0;
                let cellStyle = isSun ? { ...TD_STYLE, font: { ...FONT_BOLD, color: { rgb: "FF1E3A8A" } }, fill: { fgColor: { rgb: "FFFFF1F1" } } } : { ...TD_STYLE, font: { ...FONT_BOLD, color: { rgb: "FF1E3A8A" } } };

                row[1 + d] = { v: statusChar, t: 's', s: cellStyle };
            }

            row[absCol] = { v: lCount > 0 ? lCount : '', t: lCount > 0 ? 'n' : 's', s: { ...TD_STYLE, font: { ...FONT_BOLD, color: { rgb: "FFD97706" } } } };
            row[absCol+1] = { v: aCount > 0 ? aCount : '', t: aCount > 0 ? 'n' : 's', s: { ...TD_STYLE, font: { ...FONT_BOLD, color: { rgb: "FFDC2626" } } } };
            row[absCol+2] = { v: (lCount + aCount) > 0 ? (lCount + aCount) : '', t: (lCount + aCount) > 0 ? 'n' : 's', s: { ...TD_STYLE, font: FONT_BOLD } };
            row[absCol+3] = { v: '', t: 's', s: TD_STYLE };

            ws_data.push(row);
        }

        // Footer Signatures Setup
        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));
        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));

        let fRow = ws_data.length;
        const managerRole = appSettings.managerRole || "នាយកសាលា";
        const teacherName = customData && customData.teacher ? customData.teacher : (appSettings.teacherName || "..................");
        
        let lunarStr = "ថ្ងៃ................ខែ..........ឆ្នាំ..........";
        const today = new Date();
        if (typeof momentkh !== 'undefined') {
            try {
                const khmerDateObj = momentkh.fromDate(today);
                lunarStr = momentkh.format(khmerDateObj).replace('ពុទ្ធសករាជ', 'ព.ស.');
            } catch (e) { }
        }
        const locationStr = appSettings.location ? `${appSettings.location}, ` : "";
        const solarStr = `${locationStr}ថ្ងៃទី ${toKhmerNum(today.getDate())} ខែ ${months[today.getMonth()]} ឆ្នាំ ${toKhmerNum(today.getFullYear())}`;

        let sigRow1 = Array(totalCols).fill(null).map(() => emptyCell());
        let sigRow2 = Array(totalCols).fill(null).map(() => emptyCell());
        let sigRow3 = Array(totalCols).fill(null).map(() => emptyCell());

        sigRow1[1] = { v: 'បានឃើញ និងឯកភាព', t: 's', s: { font: FONT_NORMAL, alignment: ALIGN_CENTER } };
        sigRow2[1] = { v: managerRole, t: 's', s: { font: FONT_MOUL, alignment: ALIGN_CENTER } };
        
        let rightMid = totalCols - 7;
        sigRow1[rightMid] = { v: lunarStr, t: 's', s: { font: FONT_NORMAL, alignment: ALIGN_CENTER } };
        sigRow2[rightMid] = { v: solarStr, t: 's', s: { font: FONT_NORMAL, alignment: ALIGN_CENTER } };
        sigRow3[rightMid] = { v: 'គ្រូបន្ទុកថ្នាក់', t: 's', s: { font: FONT_MOUL, alignment: ALIGN_CENTER } };

        merges.push({s:{r:fRow, c:1}, e:{r:fRow, c:6}});
        merges.push({s:{r:fRow+1, c:1}, e:{r:fRow+1, c:6}});
        
        merges.push({s:{r:fRow, c:rightMid}, e:{r:fRow, c:totalCols-1}});
        merges.push({s:{r:fRow+1, c:rightMid}, e:{r:fRow+1, c:totalCols-1}});
        merges.push({s:{r:fRow+2, c:rightMid}, e:{r:fRow+2, c:totalCols-1}});

        ws_data.push(sigRow1, sigRow2, sigRow3);
        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));
        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));
        ws_data.push(Array(totalCols).fill(null).map(() => emptyCell()));

        let sigNameRow = Array(totalCols).fill(null).map(() => emptyCell());
        sigNameRow[rightMid] = { v: teacherName, t: 's', s: { font: FONT_MOUL, alignment: ALIGN_CENTER } };
        merges.push({s:{r:ws_data.length, c:rightMid}, e:{r:ws_data.length, c:totalCols-1}});
        ws_data.push(sigNameRow);

        // Generate Excel Workbook
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(ws_data);
        
        ws['!merges'] = merges;
        
        // កំណត់ទំហំប្រវែងជួរឈរ
        let cols = [{ wch: 4 }, { wch: 25 }]; // ល.រ, ឈ្មោះ
        for(let i=0; i<daysCount; i++) cols.push({ wch: 3.5 }); // កាលបរិច្ឆេទ
        cols.push({ wch: 4.5 }, { wch: 5.5 }, { wch: 4.5 }); // ច្បាប់, អត់ច្បាប់, សរុប
        cols.push({ wch: 6 }); // ផ្សេងៗ
        ws['!cols'] = cols;

        // កំណត់កម្ពស់ជួរដេកសម្រាប់ Header វិលអក្សរ (textRotation)
        let rows = [];
        rows[startRow] = { hpt: 20 };
        rows[startRow+1] = { hpt: 20 };
        rows[startRow+2] = { hpt: 80 }; 
        ws['!rows'] = rows;

        XLSX.utils.book_append_sheet(wb, ws, "Attendance");
        XLSX.writeFile(wb, `បញ្ជីវត្តមានសិស្ស_${className}_ខែ${months[mIdx]}_${year}.xlsx`);
    }

    async function downloadPDF() {
        const btn = document.getElementById('btnDownload');
        const originalText = btn.innerText;
        btn.innerText = "កំពុងទាញយក...";
        btn.disabled = true;

        const pages = document.querySelectorAll('.page-container');
        pages.forEach(p => {
            p.style.marginBottom = '0';
            p.style.boxShadow = 'none';
        });

        const opt = {
            margin:       0,
            filename:     `វត្តមានសិស្ស_ខែ${months[monthSelect.value]}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak:    { mode: ['css', 'legacy'] } 
        };

        html2pdf().set(opt).from(printArea).save().then(() => {
            pages.forEach(p => {
                p.style.marginBottom = '';
                p.style.boxShadow = '';
            }); 
            btn.innerText = originalText;
            btn.disabled = false;
        });
    }

    [monthSelect, yearInput, studentCountInput].forEach(el => el.addEventListener('change', () => {
        render();
    }));

    window.onload = init;
</script>
</body>
</html>
