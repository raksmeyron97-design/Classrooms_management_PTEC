<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>របាយការណ៍ពិន្ទុកិច្ចការផ្ទះសិស្ស</title>
    <!-- បន្ថែមបណ្ណាល័យសម្រាប់ Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ThyrithSor/momentkh@3.0.3/momentkh.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&family=Moul&display=swap');
        
        /* Font សម្រាប់ Excel */
        @font-face {
            font-family: 'Tacteing';
            src: local('Tacteing'); 
        }

        :root {
            --primary-font: 'Hanuman', serif;
            --title-font: 'Moul', cursive;
        }

        body {
            font-family: var(--primary-font);
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1300px;
            margin: auto;
        }

        #printArea {
            width: 100%;
            max-width: 297mm;
            margin: auto;
        }

        .page-container {
            width: 297mm;
            min-height: 190mm; 
            padding: 10mm 12mm;
            margin: 0 auto;
            box-sizing: border-box;
            background: white;
            display: flex;
            flex-direction: column;
            color: black;
            position: relative;
            overflow: hidden;
            page-break-after: always;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* បន្ថែមស្រមោលស្តើងពេលមើលលើអេក្រង់ */
        }

        .page-container:not(:last-child) {
            margin-bottom: 30px;
        }

        .page-container:last-child {
            margin-bottom: 0;
            page-break-after: auto;
        }

        .kh-moul { font-family: var(--title-font); font-weight: normal; }

        .admin-header { text-align: center; margin-bottom: 5px; }
        .report-header-img { height: 55px; width: auto; margin: 8px auto 0 auto; display: block; }
        
        .org-info { line-height: 1.3; text-align: left; font-size: 11pt; font-weight: bold; margin-bottom: 5px; }
        .org-info p { margin: 0; }
        .title-section { width: 100%; text-align: center; margin-bottom: 5px; }
        .info-row { display: flex; justify-content: space-between; width: 100%; font-size: 11pt; font-weight: bold; margin-bottom: 5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 1.2pt solid black;
        }

        thead th {
            height: 1px;
        }

        th, td {
            border: 0.8pt solid black;
            text-align: center;
            vertical-align: middle;
            padding: 0;
            font-size: 10pt;
            height: 26px;
        }

        th { background-color: #fcfcfc; font-weight: bold; }

        .id-col { width: 35px; }
        .name-col { width: 170px; text-align: left; padding-left: 8px; font-weight: bold; overflow: hidden; white-space: nowrap; }
        .gender-col { width: 45px; }
        .total-col { width: 55px; font-weight: bold; color: #0054a6; font-size: 11pt; }
        .avg-col { width: 55px; font-weight: bold; color: #0d9488; font-size: 11pt; }
        
        .sun-bg { background-color: #fff1f1 !important; }
        .sun-text { color: #d93025 !important; font-weight: bold; }

        .vertical-wrapper {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .vertical-text {
            display: block;
            white-space: nowrap;
            transform: translate(-50%, -50%) rotate(-90deg); 
            width: 48px;
            text-align: center;
            font-size: 8.5pt;
            font-weight: bold;
            position: absolute;
            left: 50%;
            top: 50%;
            line-height: 1;
        }

        .signature-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            margin-top: 25px;
            padding-top: 15px;
        }

        .sig-box { text-align: center; }
        .lunar-date { font-size: 10pt; margin-bottom: 2px; white-space: nowrap; }
        .solar-date { font-size: 10.5pt; font-weight: normal; margin-bottom: 8px; }
        .role { font-weight: bold; margin-top: 5px; margin-bottom: 45px; display: block; font-size: 11pt; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            flex-wrap: wrap;
        }

        select, input { padding: 8px; font-family: var(--primary-font); border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 25px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-family: var(--primary-font); transition: 0.3s; font-size: 14px; }
        
        /* លក្ខខណ្ឌកូដ Print យកតាម Monthly-Report ទាំងស្រុង */
        @media print {
            .controls { display: none; }
            body { padding: 0; background: white; }
            
            /* លុប Shadow ទាំងអស់ពេល Print */
            .container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                border-radius: 0 !important;
                max-width: 100% !important;
            }

            .page-container { 
                margin: 0 !important; 
                border: none; 
                box-shadow: none !important; /* លុបស្រមោល */
                min-height: auto;
                page-break-after: always;
            }
            .page-container:last-child {
                page-break-after: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label>ឆ្នាំសិក្សា៖</label>
        <select id="yearSelect" onchange="window.updateMonthOptions(); window.render()"></select>

        <label>ខែ៖</label>
        <select id="monthSelect" onchange="window.render()"></select>
        
        <!-- ប៊ូតុងទាញយក Excel ថ្មី -->
        <button id="btnExcel" onclick="window.generateExcel()" style="background: #107c41; color: white;">ទាញយក Excel</button>
        <button id="btnDownload" onclick="window.downloadPDF()" style="background: #d93025; color: white;">ទាញយក PDF</button>
        <button onclick="window.print()" style="background: #1a73e8; color: white;">បោះពុម្ព</button>
    </div>

    <div id="printArea">
        <div style="text-align:center; padding: 40px; color: #666;" id="loadingText">កំពុងផ្ទៀងផ្ទាត់គណនី និងទាញយកទិន្នន័យ...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBU50HJrekgHWwwyLq5CTRwhjHkGJAAAfs",
        authDomain: "classroom-management-82382.firebaseapp.com",
        projectId: "classroom-management-82382",
        storageBucket: "classroom-management-82382.firebasestorage.app",
        messagingSenderId: "146641865620",
        appId: "1:146641865620:web:ce693b7b064afd5d1bdd81",
        measurementId: "G-PX867PB723"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const PTEC_APP_ID = "ptec-app";
    
    let currentUser = null;
    let students = [];
    let hwScores = {}; 
    let teacherProfile = {};

    const allMonthsMap = [
        { id: 'nov', label: 'វិច្ឆិកា', isNextYear: false },
        { id: 'dec', label: 'ធ្នូ', isNextYear: false },
        { id: 'jan', label: 'មករា', isNextYear: true },
        { id: 'feb', label: 'កុម្ភៈ', isNextYear: true },
        { id: 'mar', label: 'មីនា', isNextYear: true },
        { id: 'apr', label: 'មេសា', isNextYear: true },
        { id: 'may', label: 'ឧសភា', isNextYear: true },
        { id: 'jun', label: 'មិថុនា', isNextYear: true },
        { id: 'jul', label: 'កក្កដា', isNextYear: true },
        { id: 'aug', label: 'សីហា', isNextYear: true },
        { id: 'sep', label: 'កញ្ញា', isNextYear: true },
        { id: 'oct', label: 'តុលា', isNextYear: true }
    ];

    const monthIndexMapping = {
        'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
        'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
    };

    const khDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
    const daysKhmer = ["អាទិត្យ", "ច័ន្ទ", "អង្គារ", "ពុធ", "ព្រហស្បតិ៍", "សុក្រ", "សៅរ៍"];
    
    function toKhmerNum(num) { 
        if(num === undefined || num === null || num === '') return '';
        return num.toString().split('').map(d => khDigits[d] || d).join(''); 
    }

    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const printArea = document.getElementById('printArea');
    const loadingText = document.getElementById('loadingText');

    function getStudentName(s) {
        if (s.name) return s.name;
        if (s.studentName) return s.studentName;
        if (s['ឈ្មោះ']) return s['ឈ្មោះ'];
        if (s['គោត្តនាម និងនាម']) return s['គោត្តនាម និងនាម'];

        for (let k of Object.keys(s)) {
            let cleanKey = k.toLowerCase().replace(/[\s\u200B-\u200D\uFEFF]+/g, '');
            if (['name', 'studentname', 'khmername', 'fullname', 'ឈ្មោះ', 'ឈ្មោះសិស្ស', 'គោត្តនាមនិងនាម', 'គោត្តនាមនាម'].includes(cleanKey)) {
                if (s[k]) return s[k];
            }
        }
        return '';
    }

    function getStudentId(s) {
        if (s.id) return s.id;
        if (s.studentId) return s.studentId;
        if (s.ID) return s.ID;
        if (s['អត្តលេខ']) return s['អត្តលេខ'];

        for (let k of Object.keys(s)) {
            let cleanKey = k.toLowerCase().replace(/[\s\u200B-\u200D\uFEFF]+/g, '');
            if (cleanKey === 'id' || cleanKey === 'studentid' || cleanKey.includes('អត្តលេខ') || (cleanKey.includes('លេខ') && !cleanKey.includes('ទូរស័ព្ទ'))) {
                if (s[k]) return s[k];
            }
        }
        return '-';
    }

    function getStudentGender(s) {
        if (s.gender) return s.gender;
        if (s['ភេទ']) return s['ភេទ'];
        if (s.Sex) return s.Sex;
        return '-';
    }

    async function loadTeacherProfile() {
        if (currentUser) {
            try {
                const docRef = doc(db, 'artifacts', PTEC_APP_ID, 'users', currentUser.uid, 'profile', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    teacherProfile = docSnap.data();
                    return;
                }
            } catch (error) {
                console.error("Error fetching online profile:", error);
            }
        }
        try { teacherProfile = JSON.parse(localStorage.getItem('teacherProfile') || '{}'); } catch (e) { teacherProfile = {}; }
    }

    async function loadStudentsFromFirestore() {
        if (!currentUser) return;
        try {
            const studentsRef = collection(db, 'artifacts', PTEC_APP_ID, 'users', currentUser.uid, 'students');
            const snapshot = await getDocs(studentsRef);
            students = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (!data.id && !data.ID && !data['អត្តលេខ']) {
                    data.id = doc.id;
                }
                students.push(data);
            });

            if (students.length === 0) {
                const globalDocRef = doc(db, 'artifacts', PTEC_APP_ID, 'users', currentUser.uid, 'data', 'globals');
                const globalSnap = await getDoc(globalDocRef);
                if (globalSnap.exists()) {
                    const rawData = globalSnap.data();
                    let extracted = [];
                    Object.keys(rawData).forEach(key => {
                        if (!isNaN(key) && typeof rawData[key] === 'object') {
                            extracted.push(rawData[key]);
                        }
                    });
                    if (extracted.length > 0) students = extracted;
                }
            }
            
            students.sort((a, b) => {
                const timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                const timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                return timeA - timeB;
            });
            
        } catch (error) {
            console.error("Error fetching students: ", error);
        }
    }

    function setInitialDate() {
        let d = new Date();
        let dDay = d.getDate();
        let dMonth = d.getMonth(); 
        let dYear = d.getFullYear();

        let targetMonth = dMonth;
        let targetYear = dYear;

        if (dDay >= 26) {
            targetMonth += 1;
            if (targetMonth > 11) {
                targetMonth = 0;
                targetYear += 1;
            }
        }

        let academicStartYear = (targetMonth === 10 || targetMonth === 11) ? targetYear : targetYear - 1;
        let academicYearStr = `${academicStartYear}-${academicStartYear + 1}`;

        const monthIds = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
        let targetMonthId = monthIds[targetMonth];

        return { year: academicYearStr, month: targetMonthId };
    }

    async function init() {
        const years = ['2025-2026', '2026-2027', '2027-2028', '2028-2029', '2029-2030'];
        yearSelect.innerHTML = '';
        years.forEach(y => {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerHTML = toKhmerNum(y);
            yearSelect.appendChild(opt);
        });

        const defaultDate = setInitialDate();
        let defaultYear = defaultDate.year;
        let defaultMonth = defaultDate.month;

        if (teacherProfile.academic_year) {
            const index = Array.from(yearSelect.options).findIndex(opt => opt.value === teacherProfile.academic_year || opt.innerHTML === teacherProfile.academic_year);
            if (index !== -1) {
                yearSelect.selectedIndex = index;
                defaultYear = teacherProfile.academic_year;
            }
        } else {
            const index = Array.from(yearSelect.options).findIndex(opt => opt.value === defaultYear);
            if (index !== -1) yearSelect.selectedIndex = index;
        }

        updateMonthOptions(defaultMonth);
        await render();
    }

    function updateMonthOptions(defaultMonthId = null) {
        const yearVal = yearSelect.value;
        if (!yearVal) return;
        
        const [startYear, endYear] = yearVal.split('-');
        const currentMonthVal = defaultMonthId || monthSelect.value || 'nov';

        let optionsHTML = '';
        allMonthsMap.forEach(m => {
            const y = m.isNextYear ? endYear : startYear;
            const selected = m.id === currentMonthVal ? 'selected' : '';
            optionsHTML += `<option value="${m.id}" ${selected}>ខែ${m.label} ឆ្នាំ ${toKhmerNum(y)}</option>`;
        });

        monthSelect.innerHTML = optionsHTML;
        monthSelect.value = currentMonthVal;
    }

    async function loadScores() {
        const newKey = `hw_scores_v2_${yearSelect.value}_${monthSelect.value}`;
        const oldKey = `hw_scores_${yearSelect.value}_${monthSelect.value}`;
        
        try {
            if(currentUser) {
                const docRef = doc(db, 'artifacts', PTEC_APP_ID, 'users', currentUser.uid, 'homework_scores', newKey);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().scores) {
                    hwScores = docSnap.data().scores;
                    return;
                }
            }
        } catch (error) {
            console.error("Error loading scores online:", error);
        }

        try {
            let data = JSON.parse(localStorage.getItem(newKey));
            if (data) {
                hwScores = data;
            } else {
                let oldData = JSON.parse(localStorage.getItem(oldKey));
                if (oldData) {
                    hwScores = {};
                    for (let sid in oldData) hwScores[sid] = { days: {}, total: oldData[sid] };
                } else {
                    hwScores = {};
                }
            }
        } catch (e) {
            hwScores = {};
        }
    }

    function generateDateColumns(mId, yearVal) {
        const selectedMonth = monthIndexMapping[mId];
        const [startYear, endYear] = yearVal.split('-');
        
        let currentYear = parseInt(endYear);
        if (mId === 'nov' || mId === 'dec') {
            currentYear = parseInt(startYear);
        }

        let prevMonth = selectedMonth - 1;
        let prevYear = currentYear;
        if (prevMonth < 0) {
            prevMonth = 11;
            prevYear--;
        }

        const daysInPrevMonth = new Date(prevYear, prevMonth + 1, 0).getDate();
        let columns = [];
        
        for (let d = 26; d <= daysInPrevMonth; d++) {
            const date = new Date(prevYear, prevMonth, d);
            columns.push({ dayNum: d, isSunday: date.getDay() === 0, dayOfWeek: date.getDay() });
        }
        for (let d = 1; d <= 25; d++) {
            const date = new Date(currentYear, selectedMonth, d);
            columns.push({ dayNum: d, isSunday: date.getDay() === 0, dayOfWeek: date.getDay(), fullDate: date });
        }
        
        return columns;
    }

    function createPage(startIdx, endIdx, isFirst, isLast) {
        const mId = monthSelect.value;
        const yearVal = yearSelect.value;
        const monthObj = allMonthsMap.find(m => m.id === mId);
        const monthName = monthObj ? monthObj.label : '';
        const dateColumns = generateDateColumns(mId, yearVal);
        
        const org1 = teacherProfile.management_unit_1 || "មន្ទីរអប់រំ យុវជន និងកីឡា រាជធានី/ខេត្ត..................";
        const org2 = teacherProfile.management_unit_2 || "ការិយាល័យអប់រំ យុវជន និងកីឡា ក្រុង/ស្រុក..................";
        const school = teacherProfile.school_name_admin || "សាលា..............................";
        const className = teacherProfile.class_name || "..................";
        const academicYearText = toKhmerNum(teacherProfile.academic_year || yearVal);

        let html = `<div class="page-container">`;
        
        if (isFirst) {
            html += `
                <div>
                    <div class="admin-header">
                        <h3 class="kh-moul" style="font-size: 13pt; margin:0;">ព្រះរាជាណាចក្រកម្ពុជា</h3>
                        <h3 class="kh-moul" style="font-size: 13pt; margin:0;">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                        <img src="https://lh3.googleusercontent.com/d/1BnGzoisjHxGRiMbsrP-rZ1F9zvSfdtAh" class="report-header-img" crossorigin="anonymous" style="height: 18px; width: auto; margin-top:5px;">
                    </div>
                    <div class="org-info" style="margin-top: 10px;">
                        <p>${org1}</p>
                        <p>${org2}</p>
                        <p>${school}</p>
                    </div>
                    <div class="title-section">
                        <h2 class="kh-moul" style="font-size: 13pt; margin: 0; margin-bottom: 5px;">របាយការណ៍ពិន្ទុកិច្ចការផ្ទះប្រចាំខែ ${monthName}</h2>
                        <div class="info-row">
                            <span>${className}</span>
                            <span>ឆ្នាំសិក្សា ${academicYearText}</span>
                        </div>
                    </div>
                </div>`;
        }

        html += `<table><thead>
            <tr>
                <th rowspan="3" class="id-col">ល.រ</th>
                <th rowspan="3" class="name-col">គោត្តនាម និងនាម</th>
                <th rowspan="3" class="gender-col">ភេទ</th>
                <th colspan="${dateColumns.length}">កាលបរិច្ឆេទ (២៦ ដល់ ២៥)</th>
                <th rowspan="3" class="total-col">សរុប</th>
                <th rowspan="3" class="avg-col">មធ្យមភាគ</th>
            </tr>
            <tr>`;
        
        dateColumns.forEach(col => {
            const sunClass = col.isSunday ? 'sun-bg sun-text' : '';
            html += `<th class="${sunClass}">${col.dayNum}</th>`;
        });
        html += `</tr><tr>`;

        dateColumns.forEach(col => {
            const sunClass = col.isSunday ? 'sun-bg sun-text' : '';
            html += `<th class="${sunClass}">
                <div class="vertical-wrapper">
                    <span class="vertical-text">${daysKhmer[col.dayOfWeek]}</span>
                </div>
            </th>`;
        });
        
        html += `</tr></thead><tbody>`;

        // Generate Rows ONLY for actual students (No blank padding rows added)
        for (let i = startIdx; i <= endIdx; i++) {
            const student = students[i - 1];
            if (!student) continue;

            const sId = getStudentId(student);
            const sName = getStudentName(student);
            const sGender = getStudentGender(student);

            let studentData = hwScores[sId] || { days: {}, total: '' };
            
            let displayTotal = studentData.total !== '' && studentData.total !== 0 ? studentData.total : (studentData.total === 0 && Object.keys(studentData.days||{}).length > 0 ? 0 : '');
            let displayScore = displayTotal !== '' ? displayTotal : '';
            
            let scoreCount = 0;
            dateColumns.forEach(col => {
                let dayVal = studentData.days && studentData.days[col.dayNum] !== undefined ? studentData.days[col.dayNum] : '';
                if (dayVal !== '') scoreCount++;
            });

            let average = '';
            if (displayTotal !== '' || displayTotal === 0) {
                 average = scoreCount > 0 ? (studentData.total / scoreCount).toFixed(2) : 0;
            }

            let shortGender = (sGender === 'ស្រី' || sGender === 'F') ? 'ស' : 'ប';

            html += `<tr>
                <td>${i}</td>
                <td class="name-col">${sName}</td>
                <td>${shortGender}</td>`;
            
            dateColumns.forEach(col => {
                const sunClass = col.isSunday ? 'sun-bg' : '';
                let dayVal = studentData.days && studentData.days[col.dayNum] !== undefined ? studentData.days[col.dayNum] : '';
                html += `<td class="${sunClass}">${dayVal !== '' ? dayVal : ''}</td>`;
            });
                
            html += `<td class="total-col">${displayScore}</td>
            <td class="avg-col">${average}</td>
            </tr>`;
        }
        
        html += `</tbody></table>`;

        if (isLast) {
            const teacherName = teacherProfile.homeroom_teacher || "....................................";
            const managerRole = teacherProfile.manager_role || "នាយកសាលា";
            const province = teacherProfile.province_for_date || "......................";
            
            let lunarStr = "ថ្ងៃ................ខែ..........ឆ្នាំ..........";
            const today = new Date();
            if (typeof momentkh !== 'undefined') {
                try {
                    const khmerDateObj = momentkh.fromDate(today);
                    lunarStr = momentkh.format(khmerDateObj).replace('ពុទ្ធសករាជ', 'ព.ស.');
                } catch (e) { console.error("Error formatting khmer date", e); }
            }
            const solarStr = `ធ្វើនៅ ${province} ថ្ងៃទី${toKhmerNum(today.getDate())} ខែ${allMonthsMap.find(m => m.id === ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][today.getMonth()]).label} ឆ្នាំ${toKhmerNum(today.getFullYear())}`;

            html += `
                <div class="signature-section">
                    <div class="sig-box">
                        <p style="font-size: 11pt; margin-bottom: 2px;">បានឃើញ និងឯកភាព</p>
                        <p class="role kh-moul">${managerRole}</p>
                    </div>
                    <div class="sig-box">
                        <p style="font-size: 11pt; margin-bottom: 2px;">${lunarStr}</p>
                        <p style="font-size: 11pt; margin-bottom: 5px;">${solarStr}</p>
                        <p class="role kh-moul">គ្រូបន្ទុកថ្នាក់</p>
                        <p class="kh-moul" style="margin-top:20px; position: relative;">${teacherName}</p>
                    </div>
                </div>`;
        }

        html += `</div>`;
        return html;
    }

    function render() {
        printArea.innerHTML = "";
        const total = students.length;
        
        // កំណត់ទំហំជួរយកតាម monthly-report.html ទាំងស្រុង
        const maxRowsFirstPage = 14;      
        const maxRowsFirstPageSig = 9;   
        const maxRowsOtherPage = 22;      
        const maxRowsOtherPageSig = 16;   
        const rowsToKeepWithSig = 4;      
        
        let current = 1;
        let pageNum = 1;

        while (current <= total || (total === 0 && pageNum === 1)) {
            let isFirst = (pageNum === 1);
            let remaining = total - current + 1;
            
            let limitNoSig = isFirst ? maxRowsFirstPage : maxRowsOtherPage;
            let limitWithSig = isFirst ? maxRowsFirstPageSig : maxRowsOtherPageSig;
            
            let end;
            let isLast = false;

            if (total === 0) {
                end = 0;
                isLast = true;
            } else if (remaining <= limitWithSig) {
                end = current + remaining - 1;
                isLast = true;
            } else if (remaining > limitWithSig && remaining <= limitNoSig) {
                let takeCount = remaining - rowsToKeepWithSig;
                if (takeCount <= 0) takeCount = remaining;
                end = current + takeCount - 1;
                isLast = false;
            } else {
                end = current + limitNoSig - 1;
                isLast = false;
            }
            
            printArea.innerHTML += createPage(current, end, isFirst, isLast);
            
            if (isLast || total === 0) break;
            current = end + 1;
            pageNum++;
        }
    }

                    let dayValues = [];
                    dateColumns.forEach(col => {
                        let dayVal = studentData.days && studentData.days[col.dayNum] !== undefined ? studentData.days[col.dayNum] : '';

                    let average = '';

                    wsData[startRow + i][2] = sName;
                    wsData[startRow + i][4] = shortGender;

                    wsData[startRow + i][5 + numDays] = displayTotal; // សរុប
                    wsData[startRow + i][5 + numDays + 1] = average; // មធ្យមភាគ
                });

                // ==============================
                // ៤. ផ្នែកហត្ថលេខាខាងក្រោម (Footer)
                // ==============================

                                left: { style: "thin" }, right: { style: "thin" }

                        }

                            cellStyle.font = { name: "Khmer OS Battambang", sz: 10, bold: true };
                            // បង្វិលថ្ងៃបញ្ឈរ
                            if (R === 10 && C >= 5 && C < 5 + numDays) {
                                cellStyle.alignment.textRotation = 90;
                            }
                            // ដាក់ពណ៌ថ្ងៃអាទិត្យ (ស-ក្រហម) នៅក្នុង Header
                            if ((R === 9 || R === 10) && C >= 5 && C < 5 + numDays) {
                                const colIdx = C - 5;
                                if (dateColumns[colIdx].isSunday) {
                                    cellStyle.fill = { patternType: "solid", fgColor: { rgb: "FFF1F1" } };
                                    cellStyle.font.color = { rgb: "D93025" };
                                }
                            }
                        }

                        // តម្រឹមឆ្វេងសម្រាប់ឈ្មោះសិស្ស
                        if (R >= 11 && R < endRow && (C === 2 || C === 3)) {
                            cellStyle.alignment.horizontal = "left";
                        }

                        // ពណ៌ផ្ទៃសម្រាប់ថ្ងៃអាទិត្យ ក្នុងតារាងសិស្ស
                        if (R >= 11 && R < endRow && C >= 5 && C < 5 + numDays) {
                            const colIdx = C - 5;
                            if (dateColumns[colIdx].isSunday) {
                                cellStyle.fill = { patternType: "solid", fgColor: { rgb: "FFF1F1" } };
                            }
                        }

                        ws[cellRef].s = cellStyle;
                    }
                }

                // ==============================
                // ៨. កំណត់ទំហំជួរឈរ (Column Widths)
                // ==============================
                let cols = [
                    { wch: 4 },  // A: ល.រ
                    { wch: 8 },  // B: អត្តលេខ
                    { wch: 10 }, // C: ត្រកូល
                    { wch: 10 }, // D: នាម
                    { wch: 4 },  // E: ភេទ
                ];
                for (let i = 0; i < numDays; i++) cols.push({ wch: 3.5 }); // Dates
                cols.push({ wch: 6 }); // សរុប
                cols.push({ wch: 7 }); // មធ្យមភាគ

                ws['!cols'] = cols;

                // បង្កើតនិងទាញយកឯកសារ Excel
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "ពិន្ទុ");
                
                XLSX.writeFile(wb, `ពិន្ទុកិច្ចការផ្ទះ_ខែ${monthName}.xlsx`);

            } catch (error) {
                console.error(error);
                alert("សុំទោស! មានបញ្ហាក្នុងការទាញយក Excel។");
            }

            btn.innerText = originalText;
            btn.disabled = false;
        }, 500);
    }

    // Expose functions to window (since type="module" shields scope)
    window.updateMonthOptions = updateMonthOptions;
    window.render = render;
    window.downloadPDF = downloadPDF;
    window.generateExcel = generateExcel; // បានបន្ថែម Expose Function

    // Strict Auth & Trigger initialization
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (user.isAnonymous) {
                await signOut(auth);
                alert("សូម Login ជាមួយនឹងគណនីគ្រូពិតប្រាកដដើម្បីមើលរបាយការណ៍នេះ!");
                window.close(); // Options: redirect to index.html or close print tab
                return;
            }
            currentUser = user;
            await loadTeacherProfile(); 
            await loadStudentsFromFirestore(); 
            await init();
        } else {
            // Fallback for token
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch (error) {
                    loadingText.innerText = "បរាជ័យក្នុងការចូលប្រើប្រាស់គណនី!";
                }
            } else {
                loadingText.innerText = "សូម Login មុននឹងបោះពុម្ព!";
            }
        }
    });

</script>
